name: validate

# Запуск проверок системы совместной работы (docs/COLLABORATION.md,
# docs/AUTOMATION.md) на каждый Pull Request и push в любую ветку.

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run pre-PR validation
        run: python3 scripts/validate_pr.py
