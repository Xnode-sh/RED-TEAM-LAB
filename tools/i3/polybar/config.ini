; RIG / CONTROL DECK — Polybar 3.7, 1366px and larger.
[colors]
background = #f210141f
surface = #252d40
foreground = #e6edf5
muted = #77849f
red = #ff426a
cyan = #36e2ce
amber = #f3c677

[bar/base]
width = 100%:-24
height = 34
radius = 9
offset-x = 12
offset-y = 8
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 1
border-color = #404a6080
line-size = 2
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = JetBrains Mono:style=Medium:size=9;3
font-1 = FontAwesome:size=11;3
font-2 = DejaVu Sans:size=9;3
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[bar/rig]
inherit = bar/base
bottom = false
modules-left = brand workspaces
modules-center = title
modules-right = terminal files browser telegram cava ai audio keyboard date tray power

[bar/telemetry]
inherit = bar/base
bottom = true
height = 28
modules-left = cpu memory temperature gpu disk
modules-center = node
modules-right = capture recording network traffic battery

[module/brand]
type = custom/text
format =   RED / LAB
format-foreground = ${colors.red}
format-padding = 1
click-left = ~/.config/i3/scripts/actions.sh apps
click-right = ~/.config/i3/scripts/actions.sh windows

[module/workspaces]
type = custom/script
exec = python3 ~/.config/i3/scripts/workspaces.py
tail = true

[module/title]
type = internal/xwindow
label = %title:0:24:...%
label-empty = SYSTEM / READY
label-foreground = ${colors.muted}

[module/terminal]
type = custom/text
format = 
format-foreground = ${colors.cyan}
click-left = ~/.config/i3/scripts/actions.sh terminal

[module/files]
type = custom/text
format = 
click-left = ~/.config/i3/scripts/actions.sh files

[module/browser]
type = custom/text
format = 
click-left = ~/.config/i3/scripts/actions.sh browser

[module/telegram]
type = custom/text
format = 
click-left = ~/.config/i3/scripts/actions.sh telegram

[module/cava]
type = custom/text
format = 
format-foreground = ${colors.cyan}
click-left = ~/.config/i3/scripts/actions.sh cava
click-right = ~/.config/i3/scripts/actions.sh mixer

[module/ai]
type = custom/text
format =  AI
format-foreground = ${colors.amber}
click-left = ~/.config/i3/scripts/actions.sh local-ai
click-right = ~/.config/i3/scripts/actions.sh local-ai-stop

[module/audio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.cyan}
label-volume = %percentage%%
label-muted =  MUTE
label-muted-foreground = ${colors.red}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
click-right = ~/.config/i3/scripts/actions.sh mixer

[module/keyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = caps lock
blacklist-2 = scroll lock
format = <label-layout>
label-layout-foreground = ${colors.amber}
layout-icon-0 = us;EN
layout-icon-1 = ru;RU
label-layout = %icon% · Alt+Shift

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %a %d.%m · %H:%M
label = %date%
label-foreground = ${colors.foreground}
label-padding = 1

[module/tray]
type = internal/tray
tray-size = 15
tray-spacing = 7

[module/power]
type = custom/text
format = 
format-padding = 1
format-foreground = ${colors.red}
click-left = ~/.config/i3/scripts/actions.sh power
click-right = ~/.config/i3/scripts/actions.sh lock

[module/cpu]
type = internal/cpu
interval = 3
format = <label>
format-prefix =   
format-prefix-foreground = ${colors.cyan}
label = CPU %percentage:2%%

[module/memory]
type = internal/memory
interval = 5
format-prefix =   
format-prefix-foreground = ${colors.cyan}
label = RAM %percentage_used:2%%

[module/temperature]
type = custom/script
exec = python3 ~/.config/i3/scripts/status.py temperature
interval = 5
click-left = ~/.config/i3/scripts/actions.sh dashboard

[module/gpu]
type = custom/script
exec = python3 ~/.config/i3/scripts/status.py gpu
interval = 5
click-left = ~/.config/i3/scripts/actions.sh dashboard

[module/disk]
type = internal/fs
mount-0 = /
interval = 30
fixed-values = true
spacing = 0
format-mounted = <label-mounted>
label-mounted =   %free% FREE
label-mounted-foreground = ${colors.muted}

[module/node]
type = custom/text
format = SYSTEM  /  ACER  /  DEBIAN
format-foreground = ${colors.muted}
click-left = ~/.config/i3/scripts/actions.sh dashboard
click-right = ~/.config/i3/scripts/actions.sh display

[module/capture]
type = custom/text
format =  PNG
format-foreground = ${colors.cyan}
click-left = ~/.config/i3/scripts/actions.sh screenshot-full
click-right = ~/.config/i3/scripts/actions.sh screenshot-area

[module/recording]
type = custom/script
exec = python3 ~/.config/i3/scripts/capture.py status
interval = 1
click-left = ~/.config/i3/scripts/actions.sh recording
click-right = ~/.config/i3/scripts/actions.sh recordings

[module/network]
; Capture controls stay beside telemetry rather than crowding app launchers.
type = custom/script
exec = python3 ~/.config/i3/scripts/status.py network
interval = 5
format-foreground = ${colors.cyan}
click-left = ~/.config/i3/scripts/actions.sh network
click-right = ~/.config/i3/scripts/actions.sh network-info

[module/traffic]
type = custom/script
exec = python3 ~/.config/i3/scripts/traffic.py
tail = true
format-foreground = ${colors.muted}

[module/battery]
type = custom/script
exec = python3 ~/.config/i3/scripts/status.py battery
interval = 15
click-left = ~/.config/i3/scripts/actions.sh power-settings

[settings]
screenchange-reload = true
pseudo-transparency = false
