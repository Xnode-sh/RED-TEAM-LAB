[colors]
background = #ed10131d
foreground = #e4e8f1
muted = #7e89a3
red = #ff365f
cyan = #23dcc8

[bar/rig]
width = 100%
height = 32
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = DejaVu Sans Mono:size=9;2
font-1 = DejaVu Sans:size=9;2
modules-left = brand i3
modules-center = title
modules-right = cpu memory network battery audio date tray
enable-ipc = true
wm-restack = i3
cursor-click = pointer

[module/brand]
type = custom/text
format = RED / LAB
format-foreground = ${colors.red}
click-left = rofi -show drun -theme ~/.config/rofi/rig.rasi

[module/i3]
type = internal/i3
index-sort = true
pin-workspaces = true
enable-click = true
enable-scroll = false
label-focused = %index%
label-focused-foreground = ${colors.cyan}
label-focused-underline = ${colors.cyan}
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1
label-visible = %index%
label-visible-padding = 1
label-urgent = %index%!
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1
label-mode = %mode%
label-mode-foreground = ${colors.red}

[module/title]
type = internal/xwindow
label = %title:0:32:...%
label-empty = SYSTEM / READY
label-foreground = ${colors.muted}

[module/cpu]
type = internal/cpu
interval = 3
label = CPU %percentage%%

[module/memory]
type = internal/memory
interval = 5
label = RAM %percentage_used%%

[module/network]
type = custom/script
exec = python3 ~/.config/i3/scripts/status.py network
interval = 5
format-foreground = ${colors.cyan}
click-left = nm-connection-editor

[module/battery]
type = custom/script
exec = python3 ~/.config/i3/scripts/status.py battery
interval = 15

[module/audio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-muted = MUTED
label-muted-foreground = ${colors.red}
click-right = pavucontrol

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %d.%m.%Y %H:%M
label = %date%
label-foreground = ${colors.cyan}

[module/tray]
type = internal/tray
tray-size = 16
tray-spacing = 6

[settings]
screenchange-reload = true
pseudo-transparency = false
