# Picom 12 / X11. Moderate blur for the Acer's GPU.
backend = "glx";
vsync = true;
use-damage = true;
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.28;
shadow-offset-x = -5;
shadow-offset-y = -5;
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 10;
corner-radius = 8;
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 0.9;
blur: {
  method = "dual_kawase";
  strength = 3;
};
blur-background = true;
blur-background-frame = false;
blur-background-exclude = [
  "window_type = 'desktop'", "window_type = 'dock'", "class_g = 'i3lock'"
];
shadow-exclude = [
  "window_type = 'desktop'", "window_type = 'dock'", "class_g = 'Conky'"
];
rounded-corners-exclude = [
  "window_type = 'dock'", "window_type = 'desktop'", "class_g = 'i3lock'"
];
opacity-rule = [
  "94:class_g = 'Thunar'", "96:class_g = 'TelegramDesktop'",
  "94:class_g = 'Xfce4-terminal'"
];
unredir-if-possible = true;
