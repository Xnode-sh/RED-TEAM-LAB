; RIG / SIGNAL DECK — native Qtile + PipeWire, 1366x768.
[colors]
background = #171923
foreground = #e8e6f2
muted = #8794b0
cyan = #89ddca
red = #f08095
amber = #f3c677

[bar/base]
width = 100%:-24
offset-x = 12
offset-y = 8
height = 28
radius = 14
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 1
border-color = #303344
line-size = 1
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = JetBrains Mono:style=Medium:size=9;3
font-1 = DejaVu Sans:size=9;3
font-2 = lucide:size=11;3
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize
wm-restack = generic
override-redirect = false
enable-struts = false

[bar/control]
inherit = bar/base
width = 175
modules-left = brand workspaces layout

[bar/clock]
inherit = bar/base
width = 105
offset-x = 50%:-52
modules-center = date

[bar/status]
inherit = bar/base
width = 270
offset-x = 100%:-282
modules-center = network audio controls keyboard tray power

[bar/telemetry]
inherit = bar/base
width = 530
offset-x = 50%:-265
bottom = true
height = 24
font-0 = JetBrains Mono:style=Medium:size=8;2
font-2 = lucide:size=11;2
modules-center = cpu memory temperature gpu traffic brightness

[module/brand]
type = custom/text
format = %{T3}%{T-}
format-foreground = ${colors.foreground}
format-padding = 1
click-left = python ~/.config/polybar/rig/dropdown.py apps
click-right = python ~/.config/polybar/rig/dropdown.py windows

[module/workspaces]
type = custom/script
exec = python ~/.config/polybar/rig/panel.py workspaces
tail = true
click-left = python ~/.config/polybar/rig/dropdown.py workspaces
scroll-up = python ~/.config/polybar/rig/panel.py workspace-next
scroll-down = python ~/.config/polybar/rig/panel.py workspace-prev

[module/layout]
type = custom/text
format = %{T3}%{T-}
format-foreground = ${colors.cyan}
format-padding = 1
click-left = python ~/.config/polybar/rig/dropdown.py windows

[module/title]
type = internal/xwindow
label = %title:0:22:...%
label-empty = ─ READY ─
label-foreground = ${colors.muted}

[module/terminal]
type = custom/text
format = %{T3}%{T-}
format-foreground = ${colors.cyan}
format-padding = 1
click-left = python ~/.config/polybar/rig/actions.py terminal

[module/codex]
type = custom/text
format = %{T3}%{T-}
format-foreground = ${colors.amber}
format-padding = 1
click-left = python ~/.config/polybar/rig/actions.py codex

[module/project]
type = custom/text
format = %{T3}%{T-}
format-padding = 1
click-left = python ~/.config/polybar/rig/actions.py project

[module/screenshot]
type = custom/text
format = %{T3}%{T-}
format-padding = 1
click-left = python ~/.config/polybar/rig/actions.py screenshot

[module/help]
type = custom/text
format = %{T3}%{T-}
format-padding = 1
format-foreground = ${colors.muted}
click-left = python ~/.config/polybar/rig/actions.py help

[module/audio]
type = custom/script
exec = python ~/.config/polybar/rig/panel.py audio
interval = 2
format-padding = 1
click-left = python ~/.config/polybar/rig/dropdown.py audio
click-right = python ~/.config/polybar/rig/actions.py mute
scroll-up = python ~/.config/polybar/rig/actions.py volume-up
scroll-down = python ~/.config/polybar/rig/actions.py volume-down

[module/keyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = caps lock
blacklist-2 = scroll lock
format = <label-layout>
layout-icon-0 = us;EN
layout-icon-1 = ru;RU
label-layout = %icon%
label-layout-foreground = ${colors.amber}
label-layout-padding = 1

[module/date]
type = custom/script
exec = python ~/.config/polybar/rig/panel.py clock
interval = 1
format-foreground = ${colors.foreground}
format-padding = 1
click-left = python ~/.config/polybar/rig/dropdown.py calendar

[module/power]
type = custom/text
format = %{T3}%{T-}
format-foreground = ${colors.foreground}
format-padding = 1
click-left = python ~/.config/polybar/rig/dropdown.py power

[module/tray]
type = internal/tray
tray-size = 14
tray-spacing = 5

[module/system]
type = custom/text
format = RIG
format-foreground = ${colors.cyan}
format-padding = 1
click-left = python ~/.config/polybar/rig/actions.py monitor

[module/hardware]
type = custom/text
format = ACER · i5-3337U · LTS
format-foreground = ${colors.muted}
click-left = python ~/.config/polybar/rig/actions.py monitor

[module/cpu]
type = custom/script
exec = python ~/.config/polybar/rig/panel.py cpu
tail = true
format-padding = 1
click-left = python ~/.config/polybar/rig/actions.py monitor

[module/memory]
type = custom/script
exec = python ~/.config/polybar/rig/panel.py memory
interval = 5
format-padding = 1
click-left = python ~/.config/polybar/rig/actions.py monitor

[module/temperature]
type = custom/script
exec = python ~/.config/polybar/rig/panel.py temperature
interval = 5
format-padding = 1

[module/gpu]
type = custom/script
exec = python ~/.config/polybar/rig/panel.py gpu
interval = 10
format-padding = 1

[module/root]
type = custom/script
exec = python ~/.config/polybar/rig/panel.py root
interval = 30
format-padding = 1

[module/data]
type = custom/script
exec = python ~/.config/polybar/rig/panel.py data
interval = 30
format-padding = 1
click-left = python ~/.config/polybar/rig/actions.py project

[module/network]
type = custom/script
exec = python ~/.config/polybar/rig/panel.py network
interval = 5
format-padding = 1
click-left = python ~/.config/polybar/rig/dropdown.py network
click-right = python ~/.config/polybar/rig/actions.py network

[module/traffic]
type = custom/script
exec = python ~/.config/polybar/rig/panel.py traffic
tail = true

[module/brightness]
type = custom/script
exec = python ~/.config/polybar/rig/panel.py brightness
interval = 3
scroll-up = python ~/.config/polybar/rig/actions.py bright-up
scroll-down = python ~/.config/polybar/rig/actions.py bright-down

[module/uptime]
type = custom/script
exec = python ~/.config/polybar/rig/panel.py uptime
interval = 30

[module/controls]
type = custom/text
format = %{T3}%{T-}
format-foreground = ${colors.cyan}
format-padding = 1
click-left = python ~/.config/polybar/rig/dropdown.py system

[settings]
screenchange-reload = true
pseudo-transparency = false
